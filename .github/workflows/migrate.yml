name: Migrate database

on:
  push:
    branches: [main]
    paths: ["backend/**/migrations/**", ".github/workflows/migrate.yml"]
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Skip when the database is not connected yet
        if: env.DATABASE_URL == ''
        run: echo "DATABASE_URL secret is not set, nothing to migrate."
      - uses: actions/checkout@v4
        if: env.DATABASE_URL != ''
      - uses: actions/setup-python@v5
        if: env.DATABASE_URL != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - if: env.DATABASE_URL != ''
        run: pip install -r requirements.txt
      - if: env.DATABASE_URL != ''
        run: python manage.py migrate --noinput
