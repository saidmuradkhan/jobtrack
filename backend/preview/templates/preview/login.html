<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>jobtrack · preview</title>
<style>
  :root { color-scheme: light dark; font: 16px/1.5 system-ui, "Segoe UI", Roboto, sans-serif;
          --bg: #f6f6f8; --surface: #fff; --border: #e3e2e7; --accent: #2f6fed; --muted: #77737f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15151a; --surface: #1e1e25; --border: #2f2f38; --accent: #5b8cff; --muted: #9b98a3; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); padding: 16px; box-sizing: border-box; }
  form { width: 100%; max-width: 340px; display: grid; gap: 12px; background: var(--surface);
         border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-sizing: border-box; }
  h1 { margin: 0; font-size: 1.3rem; }
  p { margin: 0; color: var(--muted); }
  input, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); }
  button { background: var(--accent); color: #fff; border: none; cursor: pointer; }
  .error { color: #d1242f; }
</style>
</head>
<body>
<form method="post">
  {% csrf_token %}
  <h1>jobtrack</h1>
  <p>This preview is private for now.</p>
  <input name="user" placeholder="User" autocomplete="username" required autofocus>
  <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <input type="hidden" name="next" value="{{ next }}">
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <button>Open</button>
</form>
</body>
</html>
